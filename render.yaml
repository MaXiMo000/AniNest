services:
  - name: aninest-backend
    type: web
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    disk:
      name: aninest-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: '24'
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: DB_PATH
        value: /var/data/aninest.db
      # Set this to the deployed frontend's real URL after its first deploy
      # (Render assigns the .onrender.com URL on creation, so this is a
      # one-time manual edit in the dashboard, not knowable ahead of time).
      - key: FRONTEND_ORIGIN
        value: https://aninest-frontend.onrender.com
      # Optional bot-check on registration. sync: false means Render prompts
      # for the value in the dashboard instead of storing it in this file —
      # leave it blank there to skip bot verification entirely. Free key at
      # https://dash.cloudflare.com/?to=/:account/turnstile
      - key: TURNSTILE_SECRET_KEY
        sync: false

  - name: aninest-frontend
    type: web
    env: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: NODE_VERSION
        value: '24'
      # Same story in reverse: point this at the backend's real URL once
      # it's deployed.
      - key: VITE_API_URL
        value: https://aninest-backend.onrender.com
      # Public site key counterpart to the backend's TURNSTILE_SECRET_KEY —
      # leave blank to skip the bot-check widget entirely.
      - key: VITE_TURNSTILE_SITE_KEY
        sync: false
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: no-referrer
      - path: /*
        name: Permissions-Policy
        value: geolocation=(), microphone=(), camera=()
      # The real header version of index.html's <meta> CSP — this one can
      # (and does) add frame-ancestors, which a <meta> tag cannot. Update
      # connect-src's onrender.com wildcard to your exact backend origin
      # once you're on a final domain, for a tighter policy.
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; img-src 'self' data: https://cdn.myanimelist.net https://s4.anilist.co https://*.anilist.co; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; script-src 'self' https://challenges.cloudflare.com; frame-src https://www.youtube.com https://www.youtube-nocookie.com https://challenges.cloudflare.com; connect-src 'self' https://*.onrender.com; base-uri 'self'; form-action 'self'; object-src 'none'; frame-ancestors 'none'"
    # Not strictly required — this app uses hash-based routing (#/browse,
    # #/anime/123), so the browser only ever requests / from the server and
    # everything after the # is handled client-side. Kept anyway as a safe
    # default in case that ever changes to path-based routing.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
