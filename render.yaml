services:
  - name: aninest-backend
    type: web
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: '24'
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      # Render's free web service plan can't attach a persistent disk at
      # all, so the database lives on Turso (free, SQLite-compatible)
      # instead — see backend/src/lib/db.js. Get these from `turso db show`
      # / `turso db tokens create` after creating a free database at
      # turso.tech. sync: false means Render prompts for them in the
      # dashboard rather than storing them in this file.
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      # Set this to the deployed frontend's real URL after its first deploy
      # (Render assigns the .onrender.com URL on creation, so this is a
      # one-time manual edit in the dashboard, not knowable ahead of time).
      - key: FRONTEND_ORIGIN
        value: https://aninest-frontend.onrender.com

  - name: aninest-frontend
    type: web
    env: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: NODE_VERSION
        value: '24'
      # Same story in reverse: point this at the backend's real URL once
      # it's deployed.
      - key: VITE_API_URL
        value: https://aninest-backend.onrender.com
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        # no-referrer breaks the YouTube trailer embeds (Error 153) — YouTube's
        # player validates the embedding page's origin via the Referer header,
        # and rejects the request outright when none is sent at all.
        # strict-origin-when-cross-origin still gives solid privacy (only the
        # bare origin leaks cross-site, nothing on downgrade to HTTP) while
        # sending enough for YouTube to work.
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: geolocation=(), microphone=(), camera=()
      # The real header version of index.html's <meta> CSP — this one can
      # (and does) add frame-ancestors, which a <meta> tag cannot. Update
      # connect-src's onrender.com wildcard to your exact backend origin
      # once you're on a final domain, for a tighter policy.
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; img-src 'self' data: https://cdn.myanimelist.net https://s4.anilist.co https://*.anilist.co; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; script-src 'self'; frame-src https://www.youtube.com https://www.youtube-nocookie.com; connect-src 'self' https://*.onrender.com; base-uri 'self'; form-action 'self'; object-src 'none'; frame-ancestors 'none'"
    # Not strictly required — this app uses hash-based routing (#/browse,
    # #/anime/123), so the browser only ever requests / from the server and
    # everything after the # is handled client-side. Kept anyway as a safe
    # default in case that ever changes to path-based routing.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
