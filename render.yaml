services:
  - name: aninest-backend
    type: web
    env: node
    # Starter ($7/mo, 0.5 CPU, 512 MB): must match the plan set in the Render
    # dashboard. While this said `free`, every Blueprint sync tried to switch
    # the service back down to Free and failed against the paid plan. Starter
    # also never spins down, so there is no cold-start delay.
    plan: starter
    rootDir: backend
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: '24'
      - key: NODE_ENV
        value: production
      # Proxies in front of Express: the frontend's /api/* rewrite plus
      # Render's load balancer. It sets which X-Forwarded-For entry is the
      # visitor's IP, so rate limits are per visitor. The backend logs
      # "proxy hop check" once after boot; if forwardedHops there differs,
      # change this to match.
      - key: TRUST_PROXY
        value: '2'
      # The database lives on Turso (free, SQLite-compatible) rather than a
      # Render disk - see backend/src/lib/db.js. Get these from `turso db show`
      # / `turso db tokens create` after creating a free database at
      # turso.tech. sync: false means Render prompts for them in the
      # dashboard rather than storing them in this file.
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      # Set this to the deployed frontend's real URL after its first deploy
      # (Render assigns the .onrender.com URL on creation, so this is a
      # one-time manual edit in the dashboard, not knowable ahead of time).
      - key: FRONTEND_ORIGIN
        value: https://aninest-frontend.onrender.com
      # Optional bot-check on registration. sync: false means Render prompts
      # for the value in the dashboard instead of storing it in this file —
      # leave it blank there to skip bot verification entirely. Free key at
      # https://dash.cloudflare.com/?to=/:account/turnstile
      - key: TURNSTILE_SECRET_KEY
        sync: false
      # Comma-separated usernames to promote to admin (unlocks the YouTube
      # search-assisted watch-source curation page and its approve/reject
      # queue) - applied on every boot, so an account must already be
      # registered before it's added here, or added and then redeployed.
      # Leave unset and nobody is an admin; the feature just stays hidden.
      - key: ADMIN_USERNAMES
        sync: false
      # Same, by numeric user id, which nobody can claim by registering a
      # name first. Preferred over ADMIN_USERNAMES.
      - key: ADMIN_USER_IDS
        sync: false
      # Powers the admin-only "search official YouTube channels" assist on
      # the watch-source curation page (see backend/src/lib/youtube.js).
      # Optional - free Google Cloud API key (YouTube Data API v3, no
      # billing required for the default 10,000-unit/day quota). Leave
      # blank to skip search-assist entirely; admins can still add links by
      # pasting a URL directly, and regular users can still submit links
      # for review either way - this key only affects the search shortcut.
      - key: YOUTUBE_API_KEY
        sync: false
      # Optional "Forgot password?" emails through Resend (free tier at
      # resend.com). Both must be set, and MAIL_FROM must be an address on a
      # domain verified in Resend. Leave blank and the reset page says it
      # isn't set up yet; everything else works either way.
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
      # Optional browser push alerts. Generate once with
      # `npx web-push generate-vapid-keys`; blank = the in-app bell only.
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false
      # Optional vibe search v2 (Claude Haiku reads requests the rules can't).
      # Blank = rules only.
      - key: ANTHROPIC_API_KEY
        sync: false

  - name: aninest-frontend
    type: web
    env: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: NODE_VERSION
        value: '24'
      # Deliberately the FRONTEND's own URL, not the backend's: API calls go
      # to /api/* on this same origin and the /api/* rewrite in `routes`
      # below proxies them to the backend. That keeps the session and CSRF
      # cookies first-party. Pointing this at aninest-backend.onrender.com
      # makes them third-party cookies (onrender.com is a public suffix),
      # which Chrome/Safari/Firefox/Brave drop under third-party-cookie
      # blocking, and every login then fails with a 403 CSRF error.
      - key: VITE_API_URL
        value: https://aninest-frontend.onrender.com
      # Public site key counterpart to the backend's TURNSTILE_SECRET_KEY —
      # leave blank to skip the bot-check widget entirely.
      - key: VITE_TURNSTILE_SITE_KEY
        sync: false
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        # no-referrer breaks the YouTube trailer embeds (Error 153) — YouTube's
        # player validates the embedding page's origin via the Referer header,
        # and rejects the request outright when none is sent at all.
        # strict-origin-when-cross-origin still gives solid privacy (only the
        # bare origin leaks cross-site, nothing on downgrade to HTTP) while
        # sending enough for YouTube to work.
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: geolocation=(), microphone=(), camera=()
      # The real header version of index.html's <meta> CSP — this one can
      # (and does) add frame-ancestors, which a <meta> tag cannot. The API is
      # same-origin (the /api/* rewrite below), so connect-src is just 'self'.
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; img-src 'self' data: https://cdn.myanimelist.net https://s4.anilist.co https://*.anilist.co https://i.ytimg.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; script-src 'self' https://challenges.cloudflare.com; frame-src https://www.youtube.com https://www.youtube-nocookie.com https://challenges.cloudflare.com; media-src 'self' https://v.animethemes.moe; connect-src 'self'; base-uri 'self'; form-action 'self'; object-src 'none'; frame-ancestors 'none'"
    # Not strictly required — this app uses hash-based routing (#/browse,
    # #/anime/123), so the browser only ever requests / from the server and
    # everything after the # is handled client-side. Kept anyway as a safe
    # default in case that ever changes to path-based routing.
    # Rules match in order, so the /api/* proxy must come before the SPA
    # catch-all. See VITE_API_URL above for why the API is proxied.
    routes:
      - type: rewrite
        source: /api/*
        destination: https://aninest-backend.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html
